name: Build IMIRROR4FREE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0.0

      - name: Build with PyInstaller (onedir)
        run: python build/build_exe.py

      - name: Smoke test — check EXE runs
        shell: pwsh
        run: |
          # Verify the EXE exists and can at least print its version
          $exe = "dist\IMIRROR4FREE\IMIRROR4FREE.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Build output not found at $exe"
            exit 1
          }
          Write-Output "✅ Build output found: $exe"
          $size = (Get-Item $exe).Length / 1MB
          Write-Output "   Size: $([math]::Round($size, 1)) MB"

          # List the dist folder contents (helpful for debugging)
          Write-Output "`nBuild output contents:"
          Get-ChildItem -Path "dist\IMIRROR4FREE" | Format-Table Name, Length -AutoSize

      - name: Upload IMIRROR4FREE
        uses: actions/upload-artifact@v4
        with:
          name: IMIRROR4FREE-Windows
          # Upload the entire onedir folder — GitHub zips it automatically
          path: dist/IMIRROR4FREE/
          retention-days: 90
