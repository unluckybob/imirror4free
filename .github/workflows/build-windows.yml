name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: python build/build_exe.py --debug

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS installer
        run: |
          # Copy the NSIS script to project root (where dist/ is)
          copy build\installer.nsi installer.nsi
          # Run NSIS to create the Setup.exe
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IMIRROR4FREE-Setup
          path: IMIRROR4FREE-Setup.exe
          retention-days: 30

      - name: Upload raw build (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: IMIRROR4FREE-Portable
          path: dist/IMIRROR4FREE/
          retention-days: 30
