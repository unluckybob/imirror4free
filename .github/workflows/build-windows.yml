name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.7.0)'
        required: false
        default: '0.7.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create output directory
        run: mkdir dist\IMIRROR4FREE

      - name: Download Python 3.12 Embeddable
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath dist\IMIRROR4FREE\python
          Write-Host "Python embeddable ready"

      - name: Configure Python paths
        shell: pwsh
        run: |
          $lines = @("python312.zip", ".", "..", "Lib\site-packages", "import site")
          $lines | Set-Content "dist\IMIRROR4FREE\python\python312._pth"
          Get-Content "dist\IMIRROR4FREE\python\python312._pth"

      - name: Install pip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & dist\IMIRROR4FREE\python\python.exe get-pip.py --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Install dependencies
        shell: pwsh
        run: |
          & dist\IMIRROR4FREE\python\python.exe -m pip install setuptools wheel --no-warn-script-location
          & dist\IMIRROR4FREE\python\python.exe -m pip install --prefer-binary -r requirements.txt --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "dependencies install failed" }

      - name: Copy source code
        shell: pwsh
        run: Copy-Item -Recurse imirror dist\IMIRROR4FREE\imirror

      - name: Copy assets
        shell: pwsh
        run: Copy-Item -Recurse assets dist\IMIRROR4FREE\assets

      - name: Compile native launcher
        shell: pwsh
        run: |
          cl.exe /nologo /O2 /Fe:dist\IMIRROR4FREE\IMIRROR4FREE.exe build\launcher.c kernel32.lib
          if ($LASTEXITCODE -ne 0) { throw "launcher compile failed" }

      - name: Create debug launcher
        shell: pwsh
        run: |
          $bat = "@echo off`r`ncd /d `"%~dp0`"`r`npython\python.exe -m imirror.main`r`npause"
          [System.IO.File]::WriteAllText("dist\IMIRROR4FREE\debug.bat", $bat)

      - name: Verify build
        shell: pwsh
        run: |
          Get-ChildItem dist\IMIRROR4FREE -Depth 0 | Format-Table Name, Length
          $sig = Get-AuthenticodeSignature "dist\IMIRROR4FREE\python\python312.dll"
          Write-Host "DLL sig: $($sig.Status)"
          & dist\IMIRROR4FREE\python\python.exe -c "import imirror; print('v' + imirror.__version__ + ' OK')"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" build\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: IMIRROR4FREE-Setup
          path: dist\IMIRROR4FREE-Setup.exe

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: IMIRROR4FREE-Portable
          path: dist\IMIRROR4FREE\
