name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.7.0)'
        required: false
        default: '0.7.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create output directory
        run: mkdir dist\MIRANCE

      - name: Download Python 3.12 Embeddable
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath dist\MIRANCE\python
          Write-Host "Python embeddable ready"

      - name: Configure Python paths
        shell: pwsh
        run: |
          $lines = @("python312.zip", ".", "..", "Lib\site-packages", "import site")
          $lines | Set-Content "dist\MIRANCE\python\python312._pth"
          Get-Content "dist\MIRANCE\python\python312._pth"

      - name: Install pip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & dist\MIRANCE\python\python.exe get-pip.py --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Install dependencies
        shell: pwsh
        run: |
          & dist\MIRANCE\python\python.exe -m pip install setuptools wheel --no-warn-script-location
          & dist\MIRANCE\python\python.exe -m pip install --prefer-binary -r requirements.txt --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "dependencies install failed" }

      - name: Copy source code
        shell: pwsh
        run: |
          # Core Python modules (root level)
          Copy-Item config.py dist\MIRANCE\config.py
          Copy-Item main.py dist\MIRANCE\main.py
          Copy-Item run.py dist\MIRANCE\run.py
          Copy-Item setup.py dist\MIRANCE\setup.py
          # mirance package
          Copy-Item -Recurse mirance dist\MIRANCE\mirance

      - name: Copy assets
        shell: pwsh
        run: Copy-Item -Recurse assets dist\MIRANCE\assets

      - name: Compile native launcher
        shell: pwsh
        run: |
          cl.exe /nologo /O2 /Fe:dist\MIRANCE\MIRANCE.exe build\launcher.c kernel32.lib
          if ($LASTEXITCODE -ne 0) { throw "launcher compile failed" }

      - name: Create debug launcher
        shell: pwsh
        run: |
          # Debug launcher needs proper path setup
          $bat = "@echo off`r`ncd /d `"%~dp0`"`r`npython\python.exe -c `"import sys; sys.path.insert(0, '.'); exec('from mirance.main import main; main()')`"`r`npause"
          [System.IO.File]::WriteAllText("dist\MIRANCE\debug.bat", $bat)

      - name: Verify build
        shell: pwsh
        run: |
          Get-ChildItem dist\MIRANCE -Depth 0 | Format-Table Name, Length
          $sig = Get-AuthenticodeSignature "dist\MIRANCE\python\python312.dll"
          Write-Host "DLL sig: $($sig.Status)"
          # Import path needs mirance package in proper location
          Push-Location dist\MIRANCE
          & .\python\python.exe -c "import sys; sys.path.insert(0, '.'); import mirance; print('v' + mirance.__version__ + ' OK')"
          Pop-Location

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" build\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: MIRANCE-Setup
          path: dist\MIRANCE-Setup.exe

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: MIRANCE-Portable
          path: dist\MIRANCE\
